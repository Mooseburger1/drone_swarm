services:
  drone_swarm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drone_swarm
    ports:
      - "6080:80"
      - "8888:8888"
    environment:
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
    volumes:
      - .:/ros2_ws
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    restart: unless-stopped